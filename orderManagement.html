<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Order Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .orders-container {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .order-id {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        .status-select {
            padding: 7px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }

        .customer-info {
            margin-bottom: 20px;
        }

        .customer-info h3 {
            margin-bottom: 10px;
        }

        .customer-info p {
            margin: 5px 0;
            color: #555;
        }

        .products {
            margin-bottom: 20px;
        }

        .products h3 {
            margin-bottom: 10px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-weight: bold;
        }

        .product-details {
            color: #666;
            margin-top: 4px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 12px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        .refresh-btn {
            margin-bottom: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .order-header,
            .order-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>ShopEase Order Management</h1>

        <p class="subtitle">
            Manage and view customer orders
        </p>

        <button
            class="refresh-btn"
            onclick="loadOrders()">

            🔄 Refresh Orders

        </button>


        <div
            id="ordersContainer"
            class="orders-container">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </div>


    <script>

        const API_URL =
            "http://localhost:5000/api/orders";


        // ==============================
        // UPDATE ORDER STATUS
        // ==============================

        document.addEventListener(
            "change",
            async (event) => {

                if (
                    !event.target.classList.contains(
                        "status-select"
                    )
                ) {
                    return;
                }


                const orderId =
                    event.target.dataset.id;

                const newStatus =
                    event.target.value;


                try {

                    const response =
                        await fetch(
                            `${API_URL}/${orderId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    status: newStatus
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Failed to update order"
                        );

                    }


                    alert(
                        "Order status updated successfully!"
                    );

                }

                catch (error) {

                    console.error(
                        "Status update error:",
                        error
                    );

                    alert(
                        "Failed to update order status."
                    );

                }

            }
        );


        // ==============================
        // LOAD ORDERS
        // ==============================

        async function loadOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            container.innerHTML = `
                <div class="loading">
                    Loading orders...
                </div>
            `;


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "Failed to load orders"
                    );

                }


                const orders =
                    await response.json();


                // NO ORDERS

                if (orders.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            No orders found.
                        </div>
                    `;

                    return;

                }


                container.innerHTML = "";


                // DISPLAY EACH ORDER

                orders.forEach(order => {

                    const orderCard =
                        document.createElement(
                            "div"
                        );


                    orderCard.className =
                        "order-card";


                    const orderDate =
                        new Date(
                            order.createdAt
                        ).toLocaleString();


                    // PRODUCTS HTML

                    let productsHTML = "";


                    order.products.forEach(
                        product => {

                            const productTotal =
                                product.price *
                                product.quantity;


                            productsHTML += `

                                <div class="product-item">

                                    <div>

                                        <div class="product-name">
                                            ${product.name}
                                        </div>

                                        <div class="product-details">
                                            Quantity:
                                            ${product.quantity}
                                        </div>

                                    </div>


                                    <div>
                                        $${productTotal.toFixed(2)}
                                    </div>

                                </div>

                            `;

                        }
                    );


                    // ORDER CARD

                    orderCard.innerHTML = `

                        <div class="order-header">

                            <div>

                                <strong>
                                    Order
                                </strong>

                                <div class="order-id">
                                    ${order._id}
                                </div>

                            </div>


                            <select
                                class="status-select"
                                data-id="${order._id}"
                            >

                                <option
                                    value="Pending"
                                    ${
                                        order.status === "Pending"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Pending
                                </option>


                                <option
                                    value="Processing"
                                    ${
                                        order.status === "Processing"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Processing
                                </option>


                                <option
                                    value="Shipped"
                                    ${
                                        order.status === "Shipped"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Shipped
                                </option>


                                <option
                                    value="Delivered"
                                    ${
                                        order.status === "Delivered"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Delivered
                                </option>


                                <option
                                    value="Cancelled"
                                    ${
                                        order.status === "Cancelled"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- CUSTOMER -->

                        <div class="customer-info">

                            <h3>
                                Customer Information
                            </h3>


                            <p>
                                <strong>Name:</strong>
                                ${order.customerName}
                            </p>


                            <p>
                                <strong>Email:</strong>
                                ${order.customerEmail}
                            </p>


                            <p>
                                <strong>Address:</strong>
                                ${order.customerAddress}
                            </p>

                        </div>


                        <!-- PRODUCTS -->

                        <div class="products">

                            <h3>
                                Ordered Products
                            </h3>

                            ${productsHTML}

                        </div>


                        <!-- FOOTER -->

                        <div class="order-footer">

                            <div class="total">

                                Total:
                                $${Number(
                                    order.totalAmount
                                ).toFixed(2)}

                            </div>


                            <div class="date">

                                ${orderDate}

                            </div>

                        </div>

                    `;


                    container.appendChild(
                        orderCard
                    );

                });

            }


            catch (error) {

                console.error(
                    "Order loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Failed to load orders.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }


        // ==============================
        // START
        // ==============================

        loadOrders();

    </script>
<script>
    const authToken = sessionStorage.getItem("authToken");
    const userData = JSON.parse(sessionStorage.getItem("user") || "null");

    if (!authToken || !userData || userData.role !== "admin") {
        window.location.href = "login.html";
    }
</script>
</body>

</html>
